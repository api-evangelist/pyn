name: Pyn
description: >-
  Pyn is an HR automation platform ("Productivity for AI-First Organizations")
  that helps people teams streamline the employee lifecycle through automated
  communications, manager enablement, and personalized employee journeys. It
  offers an HR marketplace of pre-built automation templates plus custom AI agent
  capabilities covering onboarding, manager nudges and training, company-wide
  communications, performance-review processes, and Slack-based engagement such
  as peer recognition and sentiment polling. Pyn connects to 40+ HR, comms, SSO,
  and AI systems (ADP, Workday, BambooHR, Rippling, Slack, Microsoft Teams, Okta,
  Anthropic, OpenAI) and can fire outbound webhooks to Zapier, n8n, AutomateNow,
  or a customer's own systems on key employee moments. Pyn is backed by a16z and
  Accel. This profile is maintained in the API Evangelist network; Pyn publishes
  no public REST API or developer portal, so this record captures its security,
  webhook, and identity surface.
